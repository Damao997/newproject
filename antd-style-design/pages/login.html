<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>登录 · 财年经营数据分析平台</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  /* =========================================================
     登录页（v4 · 2026-08-27）
     左侧：三件套（主标题 / Logo / Slogan）+ 极简品牌信息
     右侧：精简登录表单（账号 / 密码 / 协议 / 登录按钮）
     已移除：短信登录 Tab、验证码、其他登录方式
     ========================================================= */
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  /* ========== 1. 双栏外壳 ========== */
  .login-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 480px;
    background: #f5f5f5;
  }
  @media (max-width: 768px) {
    .login-shell { grid-template-columns: 1fr; }
    .login-side  { display: none; }
  }

  /* ========== 2. 左侧：极简三件套 ========== */
  .login-side {
    background:
      radial-gradient(circle at 80% 20%, rgba(22, 119, 255, 0.35) 0%, transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(22, 119, 255, 0.18) 0%, transparent 50%),
      linear-gradient(135deg, #001d66 0%, #0958d9 60%, #1677ff 100%);
    color: #fff;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .login-side::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .login-side::after {
    content: "";
    position: absolute;
    right: -120px; top: 50%;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(250, 140, 22, 0.18) 0%, transparent 70%);
    transform: translateY(-50%);
    pointer-events: none;
  }

  /* Logo（极简版，透明感以匹配深色侧栏） */
  .login-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .login-brand-mark {
    width: 40px; height: 40px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
    color: #fff;
  }
  .login-brand-name { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
  .login-brand-en   { display: block; font-size: 9px; font-weight: 400; color: rgba(255,255,255,.6); letter-spacing: 3px; margin-top: 2px; }

  /* 中部：主标题 + Slogan */
  .login-pitch {
    position: relative;
    max-width: 480px;
    z-index: 1;
  }
  .login-pitch h1 {
    font-size: 36px; line-height: 1.3; font-weight: 600; margin: 0 0 16px;
    letter-spacing: 0.5px;
  }
  .login-pitch h1 .accent { color: #fa8c16; }
  .login-pitch p {
    color: rgba(255, 255, 255, 0.75); font-size: 14px; line-height: 1.7; margin: 0;
    letter-spacing: 4px;
  }

  /* 底部：版权 */
  .login-foot {
    color: rgba(255, 255, 255, 0.45); font-size: 12px; position: relative; z-index: 1;
  }

  /* ========== 3. 右侧：完整表单 ========== */
  .login-form-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: #fff;
  }
  .login-form {
    width: 100%;
    max-width: 360px;
  }
  .login-form-h {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    color: #1f1f1f;
  }
  .login-form-sub {
    margin: 0 0 28px;
    font-size: 13px;
    color: #8c8c8c;
  }

  /* 表单字段 */
  .login-field {
    margin-bottom: 16px;
  }
  .login-field label {
    display: block;
    font-size: 12px;
    color: #595959;
    margin-bottom: 6px;
  }
  .login-input {
    width: 100%;
    height: 40px;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 14px;
    color: #1f1f1f;
    background: #fff;
    box-sizing: border-box;
    transition: border-color .15s, box-shadow .15s;
  }
  .login-input:focus {
    outline: none;
    border-color: #1677ff;
    box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
  }
  .login-input::placeholder { color: #bfbfbf; }

  /* 记住我 + 忘记密码 */
  .login-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 12px 0 20px;
    font-size: 13px;
  }
  .login-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #595959;
    cursor: pointer;
  }
  .login-check input { accent-color: #1677ff; }
  .login-link {
    color: #1677ff;
    cursor: pointer;
    text-decoration: none;
  }
  .login-link:hover { text-decoration: underline; }

  /* 登录主按钮 */
  .login-submit {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .login-submit:hover { opacity: .92; }
  .login-submit:active { transform: translateY(1px); }

  /* 协议勾选 */
  .login-agree {
    margin: 16px 0 0;
    font-size: 12px;
    color: #8c8c8c;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .login-agree input { margin-top: 2px; accent-color: #1677ff; }
  .login-agree a { color: #1677ff; text-decoration: none; }
  .login-agree a:hover { text-decoration: underline; }

  /* 移动端品牌条（仅 ≤ 768 显示） */
  .login-mobile-brand {
    display: none;
    text-align: center;
    padding: 32px 16px 8px;
  }
  @media (max-width: 768px) {
    .login-mobile-brand { display: block; }
  }
  .login-mobile-brand .mm-mark {
    width: 48px; height: 48px; border-radius: 10px;
    background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
    color: #fff; font-weight: 700; font-size: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
  }
  .login-mobile-brand h1 {
    font-size: 22px; font-weight: 600; margin: 0 0 4px; color: #1f1f1f;
  }
  .login-mobile-brand h1 .accent { color: #fa8c16; }
  .login-mobile-brand p {
    font-size: 12px; color: #8c8c8c; margin: 0; letter-spacing: 3px;
  }
</style>
</head>
<body>
  <div class="login-shell">

    <!-- ========== 左侧：三件套（Logo + 主标题 + Slogan） ========== -->
    <aside class="login-side">
      <div class="login-brand">
        <div class="login-brand-mark">壹</div>
        <div>
          <div class="login-brand-name">壹品慧</div>
          <span class="login-brand-en">YIPINHUI · DATA</span>
        </div>
      </div>

      <div class="login-pitch">
        <h1>财年经营<span class="accent">数据分析</span>平台</h1>
        <p>数 据 · 驱 动 经 营 决 策</p>
      </div>

      <div class="login-foot">© 2026 壹品慧 · 数据安全 / 等保三级</div>
    </aside>

    <!-- ========== 右侧：完整登录表单 ========== -->
    <main class="login-form-wrap">
      <div class="login-form">

        <!-- 移动端品牌条（≤ 768 可见） -->
        <div class="login-mobile-brand">
          <div class="mm-mark">壹</div>
          <h1>财年经营<span class="accent">数据分析</span>平台</h1>
          <p>数 据 · 驱 动 经 营 决 策</p>
        </div>

        <h2 class="login-form-h">欢迎登录</h2>
        <p class="login-form-sub">使用企业账号继续，未注册请联系管理员</p>

        <!-- 账号 -->
        <div class="login-field">
          <label for="login-account">企业账号</label>
          <input id="login-account" class="login-input" type="text" placeholder="请输入工号或邮箱" autocomplete="username" />
        </div>

        <!-- 密码 -->
        <div class="login-field">
          <label for="login-pwd">密码</label>
          <input id="login-pwd" class="login-input" type="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>

        <!-- 记住我 + 忘记密码 -->
        <div class="login-row">
          <label class="login-check">
            <input type="checkbox" checked />
            <span>7 天内自动登录</span>
          </label>
          <a class="login-link">忘记密码？</a>
        </div>

        <!-- 登录按钮 -->
        <button class="login-submit" type="button">登 录</button>

        <!-- 协议 -->
        <p class="login-agree">
          <input type="checkbox" checked />
          <span>我已阅读并同意 <a>《用户服务协议》</a> 与 <a>《隐私政策》</a></span>
        </p>

      </div>
    </main>

  </div>
</body>
</html>
