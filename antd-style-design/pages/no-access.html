<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>无访问权限 · 经营数据分析平台</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; }

  .noaccess-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #f5f5f5;
  }

  /* 左侧大色块（参考 login 蓝色渐变） */
  .noaccess-side {
    background:
      radial-gradient(circle at 80% 20%, rgba(22, 119, 255, 0.30) 0%, transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(22, 119, 255, 0.15) 0%, transparent 50%),
      linear-gradient(135deg, #001d66 0%, #1677ff 100%);
    color: #fff;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .noaccess-side::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .noaccess-brand {
    display: flex; align-items: center; gap: 12px;
    position: relative;
  }
  .noaccess-brand-mark {
    width: 40px; height: 40px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .noaccess-brand-name { font-size: 18px; font-weight: 600; letter-spacing: 1px; }

  .noaccess-pitch { position: relative; max-width: 480px; }
  .noaccess-pitch h1 { font-size: 32px; line-height: 1.3; font-weight: 600; margin: 0 0 16px; }
  .noaccess-pitch p { color: rgba(255, 255, 255, 0.75); font-size: 14px; line-height: 1.7; margin: 0; }

  .noaccess-foot { color: rgba(255, 255, 255, 0.45); font-size: 12px; position: relative; }

  /* 右侧居中白卡 */
  .noaccess-content {
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
    background: #fff;
  }
  .noaccess-card {
    width: 100%;
    max-width: 480px;
    padding: 48px 40px;
    background: #fff;
    border-radius: var(--radius-large);
    box-sizing: border-box;
    text-align: center;
  }

  /* 插画占位（新增 .antd-state-illustration） */
  .antd-state-illustration {
    width: 120px;
    height: 120px;
    margin: 0 auto 28px;
    border-radius: 24px;
    background:
      radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25) 0%, transparent 60%),
      linear-gradient(135deg, #4096ff 0%, #1677ff 60%, #0958d9 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 12px 32px rgba(22, 119, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .antd-state-illustration::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    border-radius: 18px;
    pointer-events: none;
  }
  .antd-state-illustration-icon {
    color: #fff;
    font-size: 56px;
    line-height: 1;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }
  /* 装饰圆环 */
  .antd-state-illustration-ring {
    position: absolute;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 50%;
  }
  .antd-state-illustration-ring.r1 { width: 156px; height: 156px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .antd-state-illustration-ring.r2 { width: 192px; height: 192px; left: 50%; top: 50%; transform: translate(-50%, -50%); border-color: rgba(255, 255, 255, 0.10); }

  .noaccess-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--color-foreground);
    margin: 0 0 8px;
    line-height: 1.4;
  }
  .noaccess-sub {
    color: var(--color-text-tertiary);
    font-size: 14px;
    margin: 0 0 28px;
    line-height: 1.6;
  }

  .noaccess-user {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: var(--antd-gray-2);
    border-radius: var(--radius-medium);
    margin: 0 0 24px;
    text-align: left;
  }
  .noaccess-user-info { flex: 1; min-width: 0; }
  .noaccess-user-name { font-size: 14px; font-weight: 500; color: var(--color-foreground); display: flex; align-items: center; gap: 8px; }
  .noaccess-user-meta { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }

  .noaccess-actions { display: flex; gap: 12px; margin-bottom: 20px; }
  .noaccess-actions .antd-btn { flex: 1; height: 40px; font-size: 14px; }

  .noaccess-logout {
    font-size: 13px;
    color: var(--color-text-tertiary);
    text-decoration: none;
    border-top: 1px solid var(--antd-gray-3);
    padding-top: 16px;
    display: inline-block;
    width: 100%;
    cursor: pointer;
    transition: color 0.2s;
  }
  .noaccess-logout:hover { color: var(--antd-state-error); }
  .noaccess-logout-icon { vertical-align: -3px; margin-right: 4px; }
</style>
</head>
<body>
<div class="noaccess-shell">
  <!-- 左侧大色块 -->
  <aside class="noaccess-side">
    <div class="noaccess-brand">
      <div class="noaccess-brand-mark">J</div>
      <div class="noaccess-brand-name">经营数据分析平台</div>
    </div>

    <div class="noaccess-pitch">
      <h1>安全访问<br/>按需授权</h1>
      <p>本平台采用基于角色的访问控制 (RBAC)，所有模块均按岗位职责分配权限。如需访问受限模块，请联系系统管理员提交授权申请。</p>
    </div>

    <div class="noaccess-foot">© 2026 经营数据分析平台 · v2.6.1 · 安全等级 B+</div>
  </aside>

  <!-- 右侧居中白卡 -->
  <section class="noaccess-content">
    <div class="noaccess-card">
      <!-- 插画占位 -->
      <div class="antd-state-illustration">
        <span class="antd-state-illustration-ring r2"></span>
        <span class="antd-state-illustration-ring r1"></span>
        <span class="antd-state-illustration-icon">🛡</span>
      </div>

      <h2 class="noaccess-title">您当前没有访问该模块的权限</h2>
      <p class="noaccess-sub">如需访问请联系系统管理员申请授权</p>

      <!-- 当前用户信息 -->
      <div class="noaccess-user">
        <div class="antd-avatar" style="width: 40px; height: 40px; background: var(--antd-brand-100); color: var(--color-primary); font-size: 14px;">张</div>
        <div class="noaccess-user-info">
          <div class="noaccess-user-name">张伟 <span class="antd-pill is-blue">财务总监</span></div>
          <div class="noaccess-user-meta">财务部 / 财务核算组</div>
        </div>
      </div>

      <!-- 按钮组 -->
      <div class="noaccess-actions">
        <button class="antd-btn antd-btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          联系管理员
        </button>
        <button class="antd-btn antd-btn-ghost">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          返回首页
        </button>
      </div>

      <!-- 退出登录 -->
      <a class="noaccess-logout" href="#">
        <svg class="noaccess-logout-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        退出登录
      </a>
    </div>
  </section>
</div>
</body>
</html>
