# web/nginx.conf
# 浙江壹品慧财年经营数据分析平台 — Nginx 站点配置（容器内 /etc/nginx/nginx.conf）

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    upstream backend {
        server backend:3001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Excel 导入上限 50MB，与 multer 限制一致
        client_max_body_size 50M;

        # ═══════════════════════════════════════════════════
        # 前端页面安全头
        # 注意：CSP 此处针对「浏览器加载的前端页面」，与后端 helmet
        # 针对 API 响应的 CSP 是两套，互不替代。
        #   - connect-src 只需 'self'：AI 调用一律经后端代理，
        #     前端从不直连 api.deepseek.com。
        #   - blob: 供 Excel/PDF/Word 导出与 Canvas 预览使用。
        # ═══════════════════════════════════════════════════
        add_header X-Frame-Options            "DENY"        always;
        add_header X-Content-Type-Options     "nosniff"     always;
        add_header Referrer-Policy            "same-origin" always;
        add_header X-XSS-Protection           "0"           always;
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: blob:; \
             font-src 'self' data:; \
             connect-src 'self'; \
             object-src 'none'; \
             frame-ancestors 'none'; \
             base-uri 'self'; \
             form-action 'self'" always;

        # ═══════════════════════════════════════════════════
        # AI SSE 流式接口：必须关闭所有缓冲，否则 token 无法逐条抵达
        # ═══════════════════════════════════════════════════
        location /api/v1/ai/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 依赖长连接，不能发送 Connection: close
            proxy_set_header Connection        '';

            proxy_buffering          off;
            proxy_cache              off;
            chunked_transfer_encoding on;
            # 告知中间层（如企业代理）不要缓冲
            add_header X-Accel-Buffering no always;

            # 长文生成留足时间：与后端 chatStream 90s 超时对齐并留余量
            proxy_read_timeout    180s;
            proxy_send_timeout    180s;
            proxy_connect_timeout 10s;
        }

        # ═══════════════════════════════════════════════════
        # 大文件上传：Excel 导入
        # ═══════════════════════════════════════════════════
        location /api/v1/data/imports {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 50M;
            # 大文件直传后端，不落磁盘缓冲
            proxy_request_buffering off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }

        location /api/v1/transactions/import {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 50M;
            proxy_request_buffering off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }

        # ═══════════════════════════════════════════════════
        # 健康检查
        # 后端实际端点是顶层 /health（刻意不带 /api/v1，以绕开通用限流与鉴权）。
        # 这里同时暴露 /api/v1/health 别名，兼容外部探针的习惯路径。
        # ═══════════════════════════════════════════════════
        location = /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /api/v1/health {
            proxy_pass http://backend/health;   # 重写到后端顶层 /health
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # ═══════════════════════════════════════════════════
        # 其余 API 反向代理
        # ═══════════════════════════════════════════════════
        location /api/v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';

            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_connect_timeout 10s;
        }

        # ═══════════════════════════════════════════════════
        # 静态资源：Vite 产物带内容哈希，可长期强缓存
        # ═══════════════════════════════════════════════════
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(?:ico|png|svg|webmanifest|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public" always;
            access_log off;
            try_files $uri =404;
        }

        # ═══════════════════════════════════════════════════
        # SPA 回退：index.html 绝不缓存，否则发版后用户拿到旧壳
        # ═══════════════════════════════════════════════════
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate" always;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 禁止访问隐藏文件（.env / .git 等）
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
