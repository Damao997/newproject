<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>壹品慧财务分析平台 - Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#2563eb', foreground: '#f8fafc' },
            background: '#ffffff',
            foreground: '#0a1628',
            muted: { DEFAULT: '#f1f5f9', foreground: '#64748b' },
            border: '#e2e8f0',
            card: '#ffffff',
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
          },
          borderRadius: { DEFAULT: '0.75rem' },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
    .kpi-sparkline { display: flex; align-items: flex-end; gap: 2px; height: 32px; }
    .kpi-sparkline .bar { width: 6px; border-radius: 2px; background: #2563eb; opacity: 0.3; transition: all 0.3s; }
    .kpi-sparkline .bar:last-child { opacity: 1; }
    .trend-chart { position: relative; height: 240px; display: flex; align-items: flex-end; gap: 0; padding: 0 8px; }
    .trend-chart .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .trend-chart .bar-group .bars { display: flex; align-items: flex-end; gap: 3px; height: 200px; }
    .trend-chart .bar-group .bars .bar { width: 14px; border-radius: 3px 3px 0 0; transition: height 0.6s cubic-bezier(0.22,1,0.36,1); }
    .mini-bar { display: flex; align-items: center; gap: 12px; }
    .mini-bar .bar-track { flex: 1; height: 28px; background: #f1f5f9; border-radius: 6px; overflow: hidden; }
    .mini-bar .bar-fill { height: 100%; border-radius: 6px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }
    .nav-item { transition: color 0.15s; }
    .nav-item:hover { color: #2563eb; }
    .nav-item.active { color: #2563eb; }
  </style>
</head>
<body class="bg-background text-foreground">
  <!-- Header -->
  <header class="sticky top-0 z-50 w-full border-b bg-white/95 backdrop-blur">
    <div class="container mx-auto flex h-14 items-center max-w-7xl px-4">
      <div class="mr-4 hidden md:flex">
        <a href="#" class="mr-6 flex items-center space-x-2">
          <svg class="h-6 w-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          <span class="hidden font-bold sm:inline-block">壹品慧财务分析平台</span>
        </a>
      </div>
      <nav class="flex items-center space-x-6 text-sm font-medium">
        <a href="#" class="flex items-center space-x-1 nav-item active">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="hidden sm:inline-block">首页看板</span>
        </a>
        <a href="#" class="flex items-center space-x-1 nav-item text-muted-foreground">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span class="hidden sm:inline-block">财务指标</span>
        </a>
        <a href="#" class="flex items-center space-x-1 nav-item text-muted-foreground">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></svg>
          <span class="hidden sm:inline-block">往来分析</span>
        </a>
        <a href="#" class="flex items-center space-x-1 nav-item text-muted-foreground">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span class="hidden sm:inline-block">存货管理</span>
        </a>
        <a href="#" class="flex items-center space-x-1 nav-item text-muted-foreground">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="hidden sm:inline-block">分析报告</span>
        </a>
        <a href="#" class="flex items-center space-x-1 nav-item text-muted-foreground">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
          <span class="hidden sm:inline-block">数据管理</span>
        </a>
        <a href="#" class="flex items-center space-x-1 nav-item text-muted-foreground">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span class="hidden sm:inline-block">权限管理</span>
        </a>
      </nav>
      <div class="flex flex-1 items-center justify-end space-x-2">
        <button class="relative h-8 w-8 rounded-full bg-blue-50 flex items-center justify-center">
          <span class="text-sm font-semibold text-primary">管</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">
    <div class="container mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">首页看板</h1>
          <p class="text-sm text-muted-foreground mt-1">数据更新时间: <span id="updateDate"></span></p>
        </div>
        <div class="flex items-center gap-3">
          <span class="hidden sm:inline-flex items-center gap-2 text-sm text-muted-foreground">
            <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span>
            数据实时同步
          </span>
          <button class="inline-flex items-center justify-center rounded-md text-sm font-medium border border-border bg-white h-9 px-4 hover:bg-gray-50">
            <svg class="mr-2 h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出数据
          </button>
          <button class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-primary text-white h-9 px-4 hover:bg-blue-700">
            <svg class="mr-2 h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            导入数据
          </button>
        </div>
      </div>

      <!-- KPI Cards -->
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-5 mb-5" id="kpiGrid"></div>

      <!-- Trend Chart -->
      <div class="animate-fade-in rounded-xl border-0 bg-white shadow-[0_1px_3px_0_rgba(0,0,0,0.06)] mb-5" style="animation-delay:120ms">
        <div class="flex flex-row items-center justify-between pb-2 pt-6 px-6">
          <div>
            <h3 class="flex items-center gap-3 text-lg font-semibold">
              收入趋势分析
              <span class="inline-flex items-center gap-1 text-xs font-normal text-green-600">
                <span class="relative flex h-1.5 w-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-green-500"></span></span>
                实时
              </span>
            </h3>
            <p class="text-sm text-muted-foreground mt-1">近12个月收入、成本、毛利对比</p>
          </div>
          <div class="flex items-center rounded-md bg-slate-100 p-1">
            <button class="text-xs px-3 py-1.5 rounded-md bg-white shadow-sm font-medium">同比</button>
            <button class="text-xs px-3 py-1.5 rounded-md text-muted-foreground font-medium">环比</button>
          </div>
        </div>
        <div class="px-6 pb-6">
          <div class="trend-chart" id="trendChart"></div>
          <div class="flex items-center justify-center gap-6 mt-4 text-xs text-muted-foreground">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-blue-500"></span>收入</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-orange-400"></span>成本</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-emerald-500"></span>毛利</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-gray-300"></span>预算</span>
          </div>
        </div>
      </div>

      <!-- Business Units + Alerts -->
      <div class="grid grid-cols-1 gap-5 lg:grid-cols-2 mb-5">
        <!-- Business Units -->
        <div class="animate-fade-in rounded-xl border-0 bg-white shadow-[0_1px_3px_0_rgba(0,0,0,0.06)]" style="animation-delay:200ms">
          <div class="pb-2 pt-6 px-6">
            <h3 class="flex items-center gap-2 text-lg font-semibold">
              <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-50">
                <svg class="h-4 w-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
              </div>
              事业部概览
            </h3>
          </div>
          <div class="px-6 pb-6 space-y-4" id="businessUnits"></div>
        </div>

        <!-- Alerts -->
        <div class="animate-fade-in rounded-xl border-0 bg-white shadow-[0_1px_3px_0_rgba(0,0,0,0.06)]" style="animation-delay:280ms">
          <div class="pb-2 pt-6 px-6">
            <h3 class="flex items-center gap-2 text-lg font-semibold">
              <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-100">
                <svg class="h-4 w-4 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </div>
              预警提醒
            </h3>
          </div>
          <div class="px-6 pb-6 space-y-3" id="alerts"></div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="animate-fade-in rounded-xl border-0 bg-white shadow-[0_1px_3px_0_rgba(0,0,0,0.06)]" style="animation-delay:360ms">
        <div class="pb-2 pt-6 px-6">
          <h3 class="text-lg font-semibold">快捷入口</h3>
        </div>
        <div class="px-6 pb-6">
          <div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
            <button class="group flex h-24 flex-col items-center justify-center gap-3 rounded-xl border-2 border-slate-100 bg-white transition-all duration-200 hover:-translate-y-0.5 hover:border-blue-400 hover:bg-blue-50">
              <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-50 transition-colors group-hover:bg-blue-100">
                <svg class="h-5 w-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </div>
              <span class="text-sm font-medium">导入数据</span>
            </button>
            <button class="group flex h-24 flex-col items-center justify-center gap-3 rounded-xl border-2 border-slate-100 bg-white transition-all duration-200 hover:-translate-y-0.5 hover:border-emerald-400 hover:bg-emerald-50">
              <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-100 transition-colors group-hover:bg-emerald-200">
                <svg class="h-5 w-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <span class="text-sm font-medium">新建报告</span>
            </button>
            <button class="group flex h-24 flex-col items-center justify-center gap-3 rounded-xl border-2 border-slate-100 bg-white transition-all duration-200 hover:-translate-y-0.5 hover:border-blue-400 hover:bg-blue-50">
              <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 transition-colors group-hover:bg-blue-200">
                <svg class="h-5 w-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
              </div>
              <span class="text-sm font-medium">财务指标</span>
            </button>
            <button class="group flex h-24 flex-col items-center justify-center gap-3 rounded-xl border-2 border-slate-100 bg-white transition-all duration-200 hover:-translate-y-0.5 hover:border-violet-400 hover:bg-violet-50">
              <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-violet-100 transition-colors group-hover:bg-violet-200">
                <svg class="h-5 w-5 text-violet-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </div>
              <span class="text-sm font-medium">导出报表</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Set date
    document.getElementById('updateDate').textContent = new Date().toLocaleDateString('zh-CN');

    // KPI Data
    const kpiData = [
      { title: '总收入', value: '1,234.56', unit: '万', change: 12.3, trend: [60,65,70,68,75,80], color: '#2563eb', icon: '📈' },
      { title: '总成本', value: '876.54', unit: '万', change: 8.1, trend: [50,55,58,60,62,65], color: '#f97316', icon: '💰' },
      { title: '毛利', value: '358.02', unit: '万', change: 22.5, trend: [40,45,50,55,58,62], color: '#10b981', icon: '📊' },
      { title: '费用', value: '156.78', unit: '万', change: 5.2, trend: [35,38,40,42,44,46], color: '#8b5cf6', icon: '🧾' },
      { title: '预算执行率', value: '92.3', unit: '%', change: -7.7, trend: [70,72,75,78,80,82], color: '#06b6d4', icon: '🎯' },
    ];

    const kpiGrid = document.getElementById('kpiGrid');
    kpiData.forEach((kpi, i) => {
      const isNeg = kpi.change < 0;
      const changeColor = isNeg ? 'text-red-500' : 'text-emerald-500';
      const arrow = isNeg ? '↓' : '↑';
      const maxTrend = Math.max(...kpi.trend);
      const bars = kpi.trend.map(v => `<div class="bar" style="height:${(v/maxTrend)*100}%;background:${kpi.color}"></div>`).join('');
      
      kpiGrid.innerHTML += `
        <div class="animate-fade-in rounded-xl border-0 bg-white shadow-[0_1px_3px_0_rgba(0,0,0,0.06)] p-5" style="animation-delay:${i*80}ms">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm text-muted-foreground font-medium">${kpi.title}</span>
            <span class="text-lg">${kpi.icon}</span>
          </div>
          <div class="flex items-end justify-between">
            <div>
              <div class="text-2xl font-bold tracking-tight">${kpi.value}<span class="text-sm font-normal text-muted-foreground ml-1">${kpi.unit}</span></div>
              <div class="flex items-center gap-1 mt-1 ${changeColor} text-xs font-medium">
                <span>${arrow} ${Math.abs(kpi.change)}%</span>
                <span class="text-muted-foreground font-normal">同比</span>
              </div>
            </div>
            <div class="kpi-sparkline">${bars}</div>
          </div>
        </div>
      `;
    });

    // Trend Chart
    const trendData = [
      { period: '01', revenue: 1100, cost: 800, profit: 300, budget: 1050 },
      { period: '02', revenue: 1150, cost: 820, profit: 330, budget: 1100 },
      { period: '03', revenue: 1200, cost: 850, profit: 350, budget: 1150 },
      { period: '04', revenue: 1180, cost: 860, profit: 320, budget: 1180 },
      { period: '05', revenue: 1220, cost: 870, profit: 350, budget: 1200 },
      { period: '06', revenue: 1235, cost: 877, profit: 358, budget: 1250 },
      { period: '07', revenue: 1050, cost: 750, profit: 300, budget: 1000 },
      { period: '08', revenue: 1080, cost: 770, profit: 310, budget: 1050 },
      { period: '09', revenue: 1100, cost: 780, profit: 320, budget: 1100 },
      { period: '10', revenue: 1120, cost: 790, profit: 330, budget: 1120 },
      { period: '11', revenue: 1150, cost: 800, profit: 350, budget: 1150 },
      { period: '12', revenue: 1180, cost: 820, profit: 360, budget: 1180 },
    ];
    const maxVal = 1300;
    const trendChart = document.getElementById('trendChart');
    trendData.forEach(d => {
      const rH = (d.revenue/maxVal)*200;
      const cH = (d.cost/maxVal)*200;
      const pH = (d.profit/maxVal)*200;
      const bH = (d.budget/maxVal)*200;
      trendChart.innerHTML += `
        <div class="bar-group">
          <div class="bars">
            <div class="bar" style="height:${bH}px;background:#d1d5db" title="预算: ${d.budget}万"></div>
            <div class="bar" style="height:${rH}px;background:#3b82f6" title="收入: ${d.revenue}万"></div>
            <div class="bar" style="height:${cH}px;background:#fb923c" title="成本: ${d.cost}万"></div>
            <div class="bar" style="height:${pH}px;background:#10b981" title="毛利: ${d.profit}万"></div>
          </div>
          <span class="text-xs text-muted-foreground">${d.period}月</span>
        </div>
      `;
    });

    // Business Units
    const buData = [
      { name: '华东区', revenue: 1234.56, percentage: 45, color: '#3b82f6' },
      { name: '华南区', revenue: 765.43, percentage: 28, color: '#10b981' },
      { name: '华北区', revenue: 543.21, percentage: 20, color: '#f97316' },
      { name: '其他', revenue: 210.98, percentage: 7, color: '#8b5cf6' },
    ];
    const buContainer = document.getElementById('businessUnits');
    buData.forEach(bu => {
      buContainer.innerHTML += `
        <div class="mini-bar">
          <span class="text-sm font-medium w-16 shrink-0">${bu.name}</span>
          <div class="bar-track">
            <div class="bar-fill" style="width:${bu.percentage}%;background:${bu.color}"></div>
          </div>
          <span class="text-sm font-semibold w-20 text-right">${bu.revenue.toLocaleString()}万</span>
          <span class="text-xs text-muted-foreground w-10 text-right">${bu.percentage}%</span>
        </div>
      `;
    });

    // Alerts
    const alertsData = [
      { title: '应收账款逾期预警', message: '杭州壹品慧-应收账款 逾期超 90 天 156.78 万', severity: 'warning', time: '2025/7/15 09:30' },
      { title: '预算超支预警', message: '广州分公司-销售费用 超预算 15%', severity: 'error', time: '2025/7/14 14:20' },
    ];
    const alertsContainer = document.getElementById('alerts');
    alertsData.forEach((alert, i) => {
      const isError = alert.severity === 'error';
      const borderClass = isError ? 'border-red-100' : 'border-amber-100';
      const bgClass = isError ? 'bg-gradient-to-r from-red-50 to-white' : 'bg-gradient-to-r from-amber-50 to-white';
      const iconBg = isError ? 'bg-red-100' : 'bg-amber-100';
      const iconColor = isError ? 'text-red-600' : 'text-amber-600';
      const badgeBg = isError ? 'bg-red-500' : 'bg-amber-500';
      const badgeText = isError ? '严重' : '警告';
      
      alertsContainer.innerHTML += `
        <div class="animate-fade-in rounded-xl border ${borderClass} ${bgClass} p-4 transition-all hover:shadow-md" style="animation-delay:${320+i*80}ms">
          <div class="flex items-start justify-between">
            <div class="flex items-start gap-3">
              <div class="mt-0.5 flex h-8 w-8 items-center justify-center rounded-lg ${iconBg}">

              </div>
              <div>

            </div>
            <span class="ml-2 shrink-0 inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium text-white ${badgeBg}">${badgeText}</span>

            ${alert.time}
          </div>
        </div>
      `;
    });
  </script>
</body>
